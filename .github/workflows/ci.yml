name: CI

# A pull request gets the fast answer: Linux only, the tests split three ways, and nothing that
# is not about the change. Pushes to main (and a manual dispatch, `gh workflow run ci.yml --ref
# <branch>`) get everything: Linux, macOS and Windows, and every release program, which is what
# a later tag packages instead of compiling again. Tests and the release build run together:
# each used to wait for the other.
#
# What a pull request skips, and where it is caught instead:
#   - macOS and Windows tests: main's push run, which a release waits for, and a dispatch.
#   - the release build and packaging: unless the change touches packaging, Cargo.toml or
#     Cargo.lock (the `changes` job), and always on main.
#   - everything when only docs, the site, or the review and pr-gate tooling changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/review/**"
      - ".github/scripts/**"
      - ".github/workflows/pr-review*.yml"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .config/nextest.toml: no fail-fast, a retry that reports flaky tests, and a hang timeout.
  NEXTEST_PROFILE: ci

jobs:
  # The tests are CPU-bound (about 1,300 CPU-seconds), so they scale with runners: each shard builds
  # (a warm cache makes that about a minute and a half) and runs its third or half of them.
  # `hash` keeps a test in the same shard from run to run.
  test:
    name: test (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-22.04","shard":1,"shards":3},{"os":"ubuntu-22.04","shard":2,"shards":3},{"os":"ubuntu-22.04","shard":3,"shards":3}]' || '[{"os":"ubuntu-22.04","shard":1,"shards":3},{"os":"ubuntu-22.04","shard":2,"shards":3},{"os":"ubuntu-22.04","shard":3,"shards":3},{"os":"macos-latest","shard":1,"shards":2,"features":"--features tinyclient/gui"},{"os":"macos-latest","shard":2,"shards":2,"features":"--features tinyclient/gui"},{"os":"windows-latest","shard":1,"shards":2},{"os":"windows-latest","shard":2,"shards":2}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@nextest
      # nextest runs the test binaries side by side, where `cargo test` ran them one at a time.
      # The window's own tests (prefs, search, shortcuts against the menus, the controls) build
      # only with the gui feature, so macOS turns it on for the one pass over the workspace.
      # Tests use the real media engine. Building it inside each nextest process repeats
      # Cargo resolution and serializes tests on its build lock (five minutes on a cold Mac).
      # Use the whole workspace graph so tests and the engine share dependency features.
      - name: Build test programs
        shell: bash
        run: |
          cargo build --workspace --all-targets ${{ matrix.features }} --timings
          echo "TINYCLIENT_TEST_MEDIAD=$GITHUB_WORKSPACE/target/debug/mediad${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - name: Test
        run: cargo nextest run --workspace ${{ matrix.features }} --partition hash:${{ matrix.shard }}/${{ matrix.shards }}
      # nextest does not run doc tests. Linux's run in `extras`; the other platforms' run here, once.
      - name: Doc tests
        if: matrix.shard == 1 && runner.os != 'Linux'
        run: cargo test --workspace --doc ${{ matrix.features }}

  # Linux's doc tests, and the check nothing else covers: the cfg(target_os = "ios"|"android") arms
  # are not type-checked on this host; this proves the mobile feature does not disturb the desktop
  # arms. It runs beside the test shards and shares their cache.
  extras:
    name: doc tests and mobile check
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - name: Build test programs
        run: |
          cargo build --workspace --all-targets
          echo "TINYCLIENT_TEST_MEDIAD=$GITHUB_WORKSPACE/target/debug/mediad" >> "$GITHUB_ENV"
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Window with the mobile feature enabled
        run: cargo check -p tinyclient --features "gui mobile"

  # Whether the change reaches the release build or its packaging. Only a pull request asks.
  changes:
    name: what changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(packaging/|\.github/actions/|\.github/workflows/ci\.yml$|Cargo\.toml$|Cargo\.lock$)' <<<"$files"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package (${{ matrix.artifact }})
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request that touches packaging packages Linux x86_64, which proves the release build
        # and the packaging.
        # The others build only on main, which is what a tag reuses. On a pull request the macOS
        # build took a second macOS runner beside the tests and queued behind the phone jobs.
        artifact: ${{ fromJSON(github.event_name == 'push' && '["linux-x86_64","linux-aarch64","macos","windows"]' || '["linux-x86_64"]') }}
    # Ubuntu 22.04 is the oldest glibc the release packages promise.
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-22.04","linux-aarch64":"ubuntu-22.04-arm","macos":"macos-latest","windows":"windows-latest"}')[matrix.artifact] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Linux aarch64 builds without a cache. It runs only on main, beside the longer macOS
      # tests, and its entry would be another few gigabytes in a cache already at its 10 GB cap.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.artifact == 'linux-aarch64' && 'none' || 'release' }}
      - name: Build release
        shell: bash
        env:
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      - name: Bundle tinyclient.app
        if: matrix.artifact == 'macos'
        run: packaging/bundle.sh --no-build
      - uses: actions/upload-artifact@v6
        if: matrix.artifact == 'macos'
        with:
          name: tinyclient-macos
          path: target/release/tinyclient.app

      # The release's packaging, so a change that breaks it shows here rather than at the next tag.
      - name: Package .deb, .rpm, AppImage and .tar.gz
        if: startsWith(matrix.artifact, 'linux-')
        run: |
          eval "$(packaging/linux/tools.sh)"
          packaging/linux.sh --no-build ci
          desktop-file-validate packaging/linux/dev.tinyclient.app.desktop
          dpkg-deb --info "dist/tinyclient-ci-linux-$(uname -m).deb"
          dpkg-deb --contents "dist/tinyclient-ci-linux-$(uname -m).deb"
      - uses: actions/upload-artifact@v6
        if: startsWith(matrix.artifact, 'linux-')
        with:
          name: tinyclient-${{ matrix.artifact }}
          path: dist/*

      - name: Pack binaries
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target/release/tinyclient.exe, `
            target/release/chatd.exe, `
            target/release/mediad.exe, `
            target/release/tinyclient-login.exe `
            -DestinationPath tinyclient-windows-x86_64.zip
      - uses: actions/upload-artifact@v6
        if: matrix.artifact == 'windows'
        with:
          name: tinyclient-windows-x86_64
          path: tinyclient-windows-x86_64.zip
