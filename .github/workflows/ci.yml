name: CI

# A pull request gets the fast answer: Linux only, the tests split five ways, and nothing that
# is not about the change. Pushes to main (and a manual dispatch, `gh workflow run ci.yml --ref
# <branch>`) get everything: Linux, macOS and Windows, and every release program, which is what
# a later tag packages instead of compiling again. Tests and the release build run together:
# each used to wait for the other.
#
# What a pull request skips, and where it is caught instead:
#   - macOS and Windows tests: main's push run, which a release waits for, and a dispatch.
#   - the release build and packaging: unless the `changes` job detects a packaging change.
#   - everything when only docs, the site, or the review and pr-gate tooling changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - ".github/review/**"
      - ".github/scripts/**"
      - ".github/workflows/pr-review*.yml"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .config/nextest.toml: no fail-fast, a retry that reports flaky tests, and a hang timeout.
  NEXTEST_PROFILE: ci

jobs:
  # The tests are CPU-bound (about 1,300 CPU-seconds), so they scale with runners: each shard builds
  # (a warm cache makes that about a minute and a half) and runs its fifth (on main: third or half) of them.
  # `hash` keeps a test in the same shard from run to run.
  test:
    name: test (${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-22.04","shard":1,"shards":5,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":2,"shards":5,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":3,"shards":5,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":4,"shards":5,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":5,"shards":5,"features":"--features tinyclient/gui"}]' || '[{"os":"ubuntu-22.04","shard":1,"shards":3,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":2,"shards":3,"features":"--features tinyclient/gui"},{"os":"ubuntu-22.04","shard":3,"shards":3,"features":"--features tinyclient/gui"},{"os":"macos-latest","shard":1,"shards":3,"features":"--features tinyclient/gui"},{"os":"macos-latest","shard":2,"shards":3,"features":"--features tinyclient/gui"},{"os":"macos-latest","shard":3,"shards":3,"features":"--features tinyclient/gui"},{"os":"windows-latest","shard":1,"shards":2,"features":"--features tinyclient/gui"},{"os":"windows-latest","shard":2,"shards":2,"features":"--features tinyclient/gui"}]') }}
    runs-on: ${{ matrix.os }}
    # With the gui feature a cold Windows shard took 34 minutes (2026-11-25, the first run that had
    # it), so Windows gets an hour. A red run on `main` holds back a release until it is re-run.
    timeout-minutes: ${{ runner.os == 'Windows' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - uses: taiki-e/install-action@nextest
      # nextest runs the test binaries side by side, where `cargo test` ran them one at a time.
      # The window's own tests (prefs, search, shortcuts against the menus, the controls) build
      # only with the gui feature, so macOS and Windows turn it on for the one pass over the
      # workspace.
      # Tests use the real media engine. Building it inside each nextest process repeats
      # Cargo resolution and serializes tests on its build lock (five minutes on a cold Mac).
      # Use the whole workspace graph so tests and the engine share dependency features.
      - name: Build test programs
        shell: bash
        run: |
          cargo build --workspace --all-targets ${{ matrix.features }} --timings
          echo "TINYCLIENT_TEST_MEDIAD=$GITHUB_WORKSPACE/target/debug/mediad${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"
      - name: Test
        run: cargo nextest run --workspace ${{ matrix.features }} --partition hash:${{ matrix.shard }}/${{ matrix.shards }}
      # nextest does not run doc tests. Linux's run in `extras`; the other platforms' run here, once.
      - name: Doc tests
        if: matrix.shard == 1 && runner.os != 'Linux'
        run: cargo test --workspace --doc ${{ matrix.features }}

  # Linux's doc tests, and the check nothing else covers: the cfg(target_os = "ios"|"android") arms
  # are not type-checked on this host; this proves the mobile feature does not disturb the desktop
  # arms. It runs beside the test shards and shares their cache.
  extras:
    name: doc tests and mobile check
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - name: Build test programs
        run: |
          cargo build --workspace --all-targets --features tinyclient/gui
          echo "TINYCLIENT_TEST_MEDIAD=$GITHUB_WORKSPACE/target/debug/mediad" >> "$GITHUB_ENV"
      - name: Doc tests
        run: cargo test --workspace --doc --features tinyclient/gui
      - name: Window with the mobile feature enabled
        run: cargo check -p tinyclient --features "gui mobile"

  # Whether the change reaches the release build or its packaging. Only a pull request asks.
  changes:
    name: what changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qE '^(packaging/|\.github/actions/|\.github/workflows/(ci|release)\.yml$|Cargo\.toml$|Cargo\.lock$)' <<<"$files"; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package (${{ matrix.artifact }})
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        # Packaging changes exercise Linux x86_64 and the new desktop architectures on PRs.
        # Main builds every package for a later tag to reuse.
        artifact: ${{ fromJSON(github.event_name != 'pull_request' && '["linux-x86_64","linux-aarch64","macos","macos-x86_64","windows","windows-aarch64"]' || '["linux-x86_64","macos-x86_64","windows-aarch64"]') }}
    # Ubuntu 22.04 is the oldest glibc the release packages promise.
    runs-on: ${{ fromJSON('{"linux-x86_64":"ubuntu-22.04","linux-aarch64":"ubuntu-22.04-arm","macos":"macos-latest","macos-x86_64":"macos-15-intel","windows":"windows-latest","windows-aarch64":"windows-11-arm"}')[matrix.artifact] }}
    # The macOS release build of the workspace alone passed 30 minutes once waves 7-10 landed,
    # and the uncached Intel macOS build approached 60 minutes after waves 11-19.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The additional architectures build without a cache. Each would add another large
      # entry to the repository's 10 GB cache.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ contains(fromJSON('["linux-aarch64","macos-x86_64","windows-aarch64"]'), matrix.artifact) && 'none' || 'release' }}
      - name: Build release
        shell: bash
        env:
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          case "${{ matrix.artifact }}" in
            macos-x86_64) rustc -vV | grep -Fx 'host: x86_64-apple-darwin' ;;
            windows-aarch64) rustc -vV | tr -d '\r' | grep -Fx 'host: aarch64-pc-windows-msvc' ;;
          esac
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      - name: Bundle tinyclient.app
        if: startsWith(matrix.artifact, 'macos')
        run: packaging/bundle.sh --no-build
      - uses: actions/upload-artifact@v6
        if: startsWith(matrix.artifact, 'macos')
        with:
          name: tinyclient-${{ matrix.artifact }}
          path: target/release/tinyclient.app

      # The release's packaging, so a change that breaks it shows here rather than at the next tag.
      - name: Package .deb, .rpm, AppImage and .tar.gz
        if: startsWith(matrix.artifact, 'linux-')
        run: |
          eval "$(packaging/linux/tools.sh)"
          packaging/linux.sh --no-build ci
          desktop-file-validate packaging/linux/dev.tinyclient.app.desktop
          dpkg-deb --info "dist/tinyclient-ci-linux-$(uname -m).deb"
          dpkg-deb --contents "dist/tinyclient-ci-linux-$(uname -m).deb"
      - uses: actions/upload-artifact@v6
        if: startsWith(matrix.artifact, 'linux-')
        with:
          name: tinyclient-${{ matrix.artifact }}
          path: dist/*

      # The site's "every build" numbers: this build, started on invented data and measured from
      # outside (scripts/perf/measure.ps1). The Site workflow publishes the reading when this run
      # ends. A reading that fails must not cost main its release programs, so it never fails the job.
      - name: Measure the build
        if: matrix.artifact == 'windows' && github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: scripts/perf/measure.ps1 -Mode demo -Bin target/release -Out perf/build.json -Where "a GitHub-hosted Windows runner, which has no graphics card" -Commit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v6
        if: matrix.artifact == 'windows' && github.event_name != 'pull_request' && hashFiles('perf/build.json') != ''
        with:
          name: perf-build
          path: perf/build.json

      - name: Pack binaries
        if: startsWith(matrix.artifact, 'windows')
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target/release/tinyclient.exe, `
            target/release/chatd.exe, `
            target/release/mediad.exe, `
            target/release/tinyclient-login.exe `
            -DestinationPath tinyclient-windows-${{ matrix.artifact == 'windows-aarch64' && 'aarch64' || 'x86_64' }}.zip
      - uses: actions/upload-artifact@v6
        if: startsWith(matrix.artifact, 'windows')
        with:
          name: tinyclient-windows-${{ matrix.artifact == 'windows-aarch64' && 'aarch64' || 'x86_64' }}
          path: tinyclient-windows-${{ matrix.artifact == 'windows-aarch64' && 'aarch64' || 'x86_64' }}.zip
