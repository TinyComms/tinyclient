# The lab's iOS input runner: a UI test that taps the already-running app at fractions of the
# screen. Nothing here knows tinyclient; the action script comes in as an environment variable
# (TEST_RUNNER_LAB_ACTIONS). See Tests/LabActions.swift. Generated project, never committed.
name: TinyLabUI
options:
  bundleIdPrefix: dev.tinyclient.lab
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
targets:
  TinyLabHost:
    type: application
    platform: iOS
    sources:
      - path: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinyclient.lab.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TinyLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TinyLabHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinyclient.lab.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TinyLabHost
schemes:
  TinyLabUI:
    build:
      targets:
        TinyLabHost: all
        TinyLabUITests: all
    test:
      targets:
        - TinyLabUITests
