[package]
name = "mediad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
tracing.workspace = true
serde_json.workspace = true
# The voice gateway. Same versions and TLS (Security.framework) as chatd, so nothing is built twice.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# The same TLS tungstenite uses, named here only to hand it one more certificate to trust when a
# test's fake voice server speaks `wss` (see `gateway::connector`).
native-tls = "0.2"
# Discord's end-to-end encryption (DAVE, MLS on OpenMLS). Pinned: Discord moves the floor, and a
# new version must be read before it is taken.
davey = "=0.1.5"
# A Tiny server call's members and their keys, read from the group davey keeps (`e2ee`). The
# version davey links, so nothing is built twice.
openmls = { version = "0.8.1", features = ["js"] }
# `call.e2ee` payloads, and the MLS ids of users and rooms. Both already in the tree.
base64 = "0.22"
sha2 = "0.10"
# Transport encryption of RTP. Both share `aead`, `aes` and `ghash` with davey.
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# libopus 1.3.1 transpiled to Rust: no C toolchain, cmake or system library needed.
unsafe-libopus = "=0.2.0"
# CoreAudio capture and playback, and device enumeration.
cpal = "0.18"
rand = "0.8"
# Tiny server calls: WebRTC (ICE, DTLS-SRTP, RTP) as a sans-IO library this process drives from
# its own loop. Pinned to the version tinyserver's SFU runs, and bumped with it. RustCrypto, so
# the same pure-Rust code on every platform: no OpenSSL, no C toolchain, no second TLS stack.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
# Readiness on the call's UDP socket and its ICE-TCP streams. No runtime; already in the tree
# through chatd's tokio.
mio = { version = "1", features = ["os-poll", "net"] }
# Reading voice messages and audio files for `--play`: the containers (Ogg, WebM, MP4, WAV) and
# every codec but Opus, which goes to the libopus above. Pure Rust, so no system library and
# the same on every platform; it lives here so neither the window nor chatd links a codec.
symphonia = { version = "0.5", default-features = false, features = ["ogg", "mkv", "isomp4", "wav", "pcm", "mp3", "aac", "flac", "vorbis"] }
# The microphone's processing (`process`): WebRTC's echo canceller (AEC3), noise suppression and
# automatic gain (AGC2), ported to Rust. Pure Rust like the rest, so it builds on every platform
# with no C toolchain, meson or system library; the C library's own Rust wrapper
# (`webrtc-audio-processing`) needs meson and ninja to build, and none of the other pure-Rust
# echo cancellers is WebRTC's. Pinned: a port moves fast, and a new version must be heard first.
sonora = "=0.2.0"
# Cisco's OpenH264 2.6.0 binary, loaded at runtime (`libloading`). The `source` feature
# compiles the codec from C, which this tree does not. The binary is downloaded from Cisco
# the first time a picture is encoded, and checked against the crate's known hashes.
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
# Its option names: the wrapper sets a bitrate only when it opens. The version openh264 links.
openh264-sys2 = { version = "=0.9.9", default-features = false, features = ["libloading"] }
# The watched picture is a JPEG on disk. The jpeg encoder is pure Rust.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# The Cisco binary is bz2. Pure Rust, so the release image needs no libbz2.
bzip2-rs = "0.1.2"
# The download of that binary. native-tls is already linked.
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
# MMCSS scheduling for the device callbacks and the call's tick, and the 1 ms system timer a
# call's 20 ms tick needs (`rt`). Already in the tree through cpal and mio.
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# The first camera, through Media Foundation. Pure Rust bindings. A machine with no camera
# says so, and the call stays a voice call.
nokhwa = { version = "0.10.10", default-features = false, features = ["input-native"] }

[target.'cfg(unix)'.dependencies]
# The priority of video's threads. Already in the tree through mio and cpal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# AVCaptureDevice's microphone authorization, which CoreAudio does not report.
objc2 = "0.6"
# A screen grab for a share. CoreGraphics is on the system; this does not compile C.
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
# A screen grab over the X11 protocol. Pure Rust, so the release image needs no X11 headers.
# A Wayland session with no XWayland says so in words and the call stays a voice call.
x11rb = "0.13"

[dev-dependencies]
# The fake voice server acts as Discord's MLS external sender. Same version davey links.
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
