name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf
        run: brew install protobuf
      - uses: swatinem/rust-cache@v2
      - name: Test (no GUI)
        run: cargo test --workspace
      # The window's own tests (prefs, search, shortcuts against the menus, the controls) build
      # only with the gui feature.
      - name: Test the window
        run: cargo test -p tinyclient --features gui
      - name: Build release
        env:
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      - name: Bundle tinyclient.app
        run: packaging/bundle.sh --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: tinyclient-macos
          path: target/release/tinyclient.app

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libvulkan-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libxcb1-dev libfontconfig1-dev protobuf-compiler librsvg2-bin desktop-file-utils
      - uses: swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        env:
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      # The release's packaging, so a change that breaks it shows here rather than at the next tag.
      # About a minute; the install tests on clean systems run in release.yml only.
      - name: Package .deb, .rpm, AppImage and .tar.gz
        run: |
          eval "$(packaging/linux/tools.sh)"
          packaging/linux.sh --no-build ci
          desktop-file-validate packaging/linux/dev.tinyclient.app.desktop
          dpkg-deb --info dist/tinyclient-ci-linux-x86_64.deb
          dpkg-deb --contents dist/tinyclient-ci-linux-x86_64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: tinyclient-linux-x86_64
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: OpenSSL from Git
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Install protobuf
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath protoc
          echo "$pwd\protoc\bin" >> $env:GITHUB_PATH
      - name: Test
        run: cargo test --workspace
      - name: Build release
        env:
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release `
            -p tinyclient --features tinyclient/gui `
            -p chatd -p mediad -p login
      - name: Pack binaries
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target/release/tinyclient.exe, `
            target/release/chatd.exe, `
            target/release/mediad.exe, `
            target/release/tinyclient-login.exe `
            -DestinationPath tinyclient-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tinyclient-windows-x86_64
          path: tinyclient-windows-x86_64.zip
