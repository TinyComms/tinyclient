# cargo-nextest runs each test in its own process and every test binary at once, where
# `cargo test` ran the binaries one after another. CI selects the `ci` profile through
# NEXTEST_PROFILE; a local `cargo nextest run` keeps nextest's defaults.

# mediad's voice tests run a TLS server with a certificate each test process makes. On Windows,
# native-tls imports every such key into the one CryptoAPI key container it names ("schannel"),
# so two processes at once replace each other's key and the handshake fails. One at a time there.
[test-groups]
windows-tls = { max-threads = 1 }

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary_id(mediad::voice)'
test-group = 'windows-tls'

[profile.ci]
# Run everything, so one failure does not hide the next.
fail-fast = false
# a_media_drop_finds_a_dead_socket_at_once passes on Linux only when other chatd tests have run
# in the same process before it. Alone, it times out every time, under plain `cargo test` as
# well (`cargo test -p chatd --lib a_media_drop_finds`). nextest gives each test its own process,
# so it is left out here until the test stands on its own.
default-filter = 'not (binary_id(chatd) & test(=adapters::tiny::live::tests::a_media_drop_finds_a_dead_socket_at_once))'
# A test that fails and then passes is reported as FLAKY in the summary, not dropped.
retries = 1
# A few call and MLS tests legitimately take a minute or more. Ten minutes is a hang.
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
success-output = "never"

# Known to fail now and then on a loaded runner and pass on the next run. More tries here
# keep it from failing the build while it is looked into.
[[profile.ci.overrides]]
filter = 'binary_id(chatd::telegram) & test(=a_channel_posts_comments_count_rides_the_post)'
retries = 3
