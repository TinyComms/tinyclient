[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/chatd",
    "crates/mediad",
    "crates/login",
    "crates/tinyclient",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "crates/protocol" }
