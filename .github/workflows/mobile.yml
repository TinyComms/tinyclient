name: Mobile

# The desktop workflow (ci.yml) already builds and tests the host, and checks the window with
# the mobile feature on. This one proves the two things it cannot: that the crate still compiles
# for the phones, and that the native shells package. One job per phone, android-app and
# ios-app. Nothing here is signed or uploaded to a store.
#
# Versions are the ones checked against vendor docs on 2026-10-31
# (research_notes/mobile/build-ci-release.md, rust-core-native-shells.md):
#   NDK r30 LTS 30.0.16248370 · cargo-ndk 4.1.2 · AGP 9.5.0 · Gradle 9.6 · JDK 17+
#   macos-26 (Xcode 26.6) until the April 2027 iOS 27 SDK mandate.
on:
  push:
    branches: [main]
    paths:
      - "crates/tinyclient/**"
      - "crates/protocol/**"
      - "mobile/**"
      - "scripts/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "crates/tinyclient/**"
      - "crates/protocol/**"
      - "mobile/**"
      - "scripts/mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NDK_VERSION: "4.1.2"
  NDK_VERSION: "30.0.16248370"
  GRADLE_VERSION: "9.6.0"
  # Cargo.toml release is thin LTO and one codegen unit, which is what a tag ships.
  # This workflow only proves the library links and the shell packages, and those settings
  # are why it was slow. A warm cache still spent 6m04s on arm64 and 5m25s on x86_64
  # (run 41925105003): the cache keeps dependencies, then LLVM rebuilds the workspace
  # crates. A miss spent 13m and 11m (run 41927743886, 24m06s on that step) because the
  # 1.5 GB android entry had been evicted. The repository cache sits on its 10 GB cap.
  # Overrides here apply to this workflow's --release builds only, and they are part of
  # the cache key, so desktop CI keeps the real release profile.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"

jobs:
  # Each phone builds its Rust library and packages the app in one job. They used to be two jobs
  # apiece, and the app job waited in a second runner queue and then downloaded the library.
  # v2 is a different cache from the thin-LTO target dirs. The restore prefix ignores the
  # env hash, so leaving v1 would download that 1 GB and then compile it all again.
  android-app:
    name: android (libs + assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # x86_64 is the emulator slice. A local build still makes it. CI would compile and
      # link the whole library a second time, and that second target is what made the
      # android cache the one that no longer fit.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          shared-key: mobile-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The action's default list asks for `tools`, which the SDK no longer carries, and fails.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: NDK r30
        # The runner image leaves ANDROID_NDK_ROOT on r27. cargo-ndk warns and can link
        # against that one while ANDROID_NDK_HOME says r30.
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: cargo-ndk
        # The release archive is the same version as `cargo install --locked`, without
        # compiling cargo-ndk itself (35s) on every cache miss.
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            exit 0
          fi
          archive="cargo-ndk-x86_64-unknown-linux-gnu-v${CARGO_NDK_VERSION}.tgz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/bbqsrc/cargo-ndk/releases/download/v${CARGO_NDK_VERSION}/${archive}"
          rm -rf /tmp/cargo-ndk-extract
          mkdir -p /tmp/cargo-ndk-extract "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "/tmp/${archive}" -C /tmp/cargo-ndk-extract
          src=$(echo /tmp/cargo-ndk-extract/cargo-ndk-*)
          install -m 755 "$src/cargo-ndk" "$src/cargo-ndk-env" "$src/cargo-ndk-runner" "$src/cargo-ndk-test" \
            "${CARGO_HOME:-$HOME/.cargo}/bin/"

      - name: Build the Rust library
        env:
          # chatd runs in the app, and its build script refuses a release without these.
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        # Output is the layout AGP packages automatically: jniLibs/<abi>/libtinyclient.so.
        # `--platform 29` matches minSdk: below it the NDK has no libnativewindow to link.
        # The app loads only the shared library, so `--crate-type cdylib` builds that one instead
        # of every type in [lib] crate-type.
        run: |
          cargo ndk -t arm64-v8a --platform 29 \
            -o mobile/android/app/src/main/jniLibs \
            rustc --release -p tinyclient --lib --features mobile --crate-type cdylib

      - name: 16 KB page check
        # Play blocks updates without 16 KB support from 2027-02-01, and a misaligned ELF
        # segfaults at load on a 16 KB device while looking perfect on 4 KB test hardware.
        # Every PT_LOAD alignment must be 0x4000, not 0x1000.
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          so=mobile/android/app/src/main/jniLibs/arm64-v8a/libtinyclient.so
          "$readelf" -lW "$so" | awk '/LOAD/ { print $NF }' | tee /tmp/align.txt
          if grep -qv '^0x4000$' /tmp/align.txt; then
            echo "::error::$so has a PT_LOAD segment that is not 16 KB aligned"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The wrapper jar is not committed, so CI supplies Gradle itself.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Auth lifecycle tests and assembleDebug
        working-directory: mobile/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: APK alignment
        run: |
          apk=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          zipalign="$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -n 1)"
          "$zipalign" -c -P 16 4 "$apk"

      - uses: actions/upload-artifact@v6
        with:
          name: tinyclient-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-app:
    name: ios (libs + unsigned archive)
    # Xcode is macOS-only. macos-26 carries Xcode 26.6 / iOS 26.5 SDK, which satisfies the
    # current mandate; move to the xcode-27 preview image before April 2027.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The archive below is for a device, so the simulator slices are not built here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          shared-key: mobile-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the device library and make the xcframework
        env:
          # chatd runs in the app, and its build script refuses a release without these.
          TINYCLIENT_TELEGRAM_API_ID: ${{ secrets.TINYCLIENT_TELEGRAM_API_ID }}
          TINYCLIENT_TELEGRAM_API_HASH: ${{ secrets.TINYCLIENT_TELEGRAM_API_HASH }}
        run: |
          chmod +x scripts/mobile/build-ios.sh
          scripts/mobile/build-ios.sh --device-only

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Archive without signing
        # Signing needs an Apple Developer Program team and certificates; this job only proves
        # the project, plist and library link. `-allowProvisioningUpdates` belongs in the
        # release workflow, with an App Store Connect API key.
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project Tiny.xcodeproj \
            -scheme Tiny \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tiny.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - uses: actions/upload-artifact@v6
        with:
          name: tinyclient-ios-unsigned
          path: mobile/ios/build/Tiny.xcarchive/Products/Applications/Tiny.app
          if-no-files-found: error
