<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tinyclient design 08: first run, sign-in, accounts, settings</title>
<style>
:root{
  --rail:#0c0d11;--sidebar:#111217;--canvas:#15161c;--panel:#1b1c24;
  --hairline:rgba(255,255,255,.06);--hairline-strong:rgba(255,255,255,.12);
  --raised:rgba(255,255,255,.04);--hover:rgba(255,255,255,.05);--selected:rgba(255,255,255,.09);
  --text:#ededf2;--soft:#a0a2b1;--faint:#676a7d;
  --accent:#7f8cff;--accent-soft:rgba(127,140,255,.15);--on-accent:#0c0d11;
  --positive:#3fcf8e;--danger:#f2616b;--danger-soft:rgba(242,97,107,.14);
  --warning:#e3a94a;--warning-soft:rgba(227,169,74,.14);--scrim:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090c;color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:40px;-webkit-font-smoothing:antialiased}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.lead{color:var(--soft);margin-bottom:36px;max-width:900px}
figure{margin:0 0 56px}
figcaption{color:var(--soft);font-size:13px;margin-top:12px;max-width:1000px}
figcaption b{color:var(--text);font-weight:600}
.pair{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.win{position:relative;background:var(--canvas);border-radius:12px;overflow:hidden;border:1px solid var(--hairline-strong);flex:none}
.lights{position:absolute;left:20px;top:20px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.14)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.g{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* text */
.t22{font-size:22px;font-weight:600;letter-spacing:-.2px}
.t17{font-size:17px;font-weight:600}
.t15{font-size:15px;font-weight:600}
.b{font-weight:600}.soft{color:var(--soft)}.faint{color:var(--faint)}.s12{font-size:12px}.s13{font-size:13px}
.err{color:var(--danger);font-size:12px}
.link{color:var(--accent);font-size:13px;cursor:pointer}
/* buttons */
.btn{height:30px;padding:0 14px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;flex:none;white-space:nowrap}
.btn.lg{height:34px;padding:0 16px;border-radius:17px;font-size:14px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.quiet{background:var(--selected);color:var(--text)}
.btn.danger{background:var(--danger);color:var(--on-accent)}
.btn.dsoft{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}
/* first run list */
.netcard{width:440px;background:var(--raised);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
.net{height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--hairline)}
.net:first-child{border-top:0}
.net .w{flex:1;min-width:0}
.net.focus{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:14px 14px 0 0}
.net.off .ico{opacity:.55}.net.off .b{color:var(--soft)}
.net.dim{opacity:.4}
/* helper window */
.helper{position:absolute;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);display:flex;flex-direction:column}
.helper .bar{height:28px;background:#e9e9ec;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#3a3a3e;position:relative;flex:none}
.helper .bar span{position:absolute;left:10px;top:8px;display:flex;gap:8px}
.helper .bar i{width:12px;height:12px;border-radius:6px}
.helper .page{flex:1;background:#313338;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#b5bac1;font-size:12px;text-align:center;padding:24px}
.ph{width:240px;height:36px;border-radius:4px;background:#1e1f22}
/* sheet */
.sheet{position:relative;width:440px;background:var(--panel);border:1px solid var(--hairline-strong);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5);padding:28px}
.sheet .hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px}
.ws{height:56px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--hairline)}
.sq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.av{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.sw{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.16);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff}
.sw.on{background:var(--accent)}.sw.on::after{left:18px}
.field{height:40px;border-radius:10px;background:var(--raised);border:1px solid var(--hairline-strong);display:flex;align-items:center;padding:0 12px;font-size:15px}
.field.focus{border-color:var(--accent)}
.field.bad{border-color:var(--danger)}
.digit{width:48px;height:56px;border-radius:10px;background:var(--raised);border:1px solid var(--hairline-strong);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600}
.digit.bad{border-color:var(--danger)}
.qr{width:232px;height:232px;border-radius:14px;background:#fff;padding:16px;margin:20px auto 18px}
.steps{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--soft)}
.steps div{display:flex;gap:10px}
.steps i{font-style:normal;width:18px;height:18px;border-radius:9px;background:var(--selected);color:var(--text);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.disc{width:56px;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
/* mini shell */
.shell{display:flex;height:100%}
.rail{width:72px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:60px 0 14px;gap:10px;flex:none}
.rb{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--soft)}
.rb.sel{background:var(--selected);color:var(--text)}
.rb .dot{position:absolute;right:2px;bottom:2px;width:10px;height:10px;border-radius:5px;border:2px solid var(--rail)}
.side{width:316px;background:var(--sidebar);border-right:1px solid var(--hairline);flex:none;display:flex;flex-direction:column}
.crow{height:64px;display:flex;align-items:center;gap:12px;padding:0 12px;margin:0 8px;border-radius:12px}
.crow.sel{background:var(--selected)}
.crow .av,.crow .sq{width:40px;height:40px;font-size:14px}
.crow .sq{border-radius:12px}
.crow .w{flex:1;min-width:0}
.conv{flex:1;display:flex;flex-direction:column;min-width:0}
.msg{display:flex;gap:12px;padding:8px 20px}
/* settings */
.set{display:flex;height:100%}
.nav{width:184px;background:var(--sidebar);border-right:1px solid var(--hairline);padding:52px 8px 8px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav div{height:32px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:13px;color:var(--soft)}
.nav .sel{background:var(--selected);color:var(--text);font-weight:600}
.pane{flex:1;padding:20px 28px 0;min-width:0}
.pane h2{font-size:17px;font-weight:600;height:32px;margin-bottom:12px}
.grp{background:var(--raised);border:1px solid var(--hairline);border-radius:12px;margin-bottom:16px}
.ctl{min-height:44px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--hairline)}
.ctl:first-child{border-top:0}
.ctl .w{flex:1;min-width:0}
.lab{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px 2px}
.seg{display:flex;background:var(--raised);border:1px solid var(--hairline);border-radius:9px;padding:2px;height:28px;flex:none}
.seg div{padding:0 10px;border-radius:7px;font-size:12px;display:flex;align-items:center;color:var(--soft)}
.seg .on{background:var(--selected);color:var(--text);font-weight:600}
.sel-box{height:28px;border-radius:8px;background:var(--raised);border:1px solid var(--hairline-strong);padding:0 10px;display:flex;align-items:center;gap:8px;font-size:13px;flex:none}
.state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.state i{width:7px;height:7px;border-radius:4px;background:var(--positive)}
.acct{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px 0 8px;border-top:1px solid var(--hairline)}
.acct:first-child{border-top:0}
.acct.sub{padding-left:38px}
.bar4{height:8px;border-radius:4px;background:var(--selected);display:flex;overflow:hidden;margin:12px 0 10px}
.icons{display:flex;gap:48px;align-items:flex-end;padding:40px;background:linear-gradient(180deg,#2a2c36,#1c1d24);border-radius:12px;width:max-content}
.icons div{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;color:var(--soft)}
</style>
</head>
