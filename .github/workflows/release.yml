name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: Test (no GUI)
        run: cargo test --workspace
        continue-on-error: true
      - name: Build release
        env:
          TINYCHAT_TELEGRAM_API_ID: ${{ secrets.TINYCHAT_TELEGRAM_API_ID }}
          TINYCHAT_TELEGRAM_API_HASH: ${{ secrets.TINYCHAT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      - name: Bundle tinyclient.app
        run: packaging/bundle.sh --no-build
      - name: Zip app bundle
        run: ditto -c -k --keepParent target/release/tinyclient.app "tinyclient-${{ github.ref_name }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: tinyclient-${{ github.ref_name }}-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libvulkan-dev libwayland-dev libxkbcommon-dev libx11-dev \
            libxcb1-dev libfontconfig1-dev
      - uses: swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
        continue-on-error: true
      - name: Build release
        env:
          TINYCHAT_TELEGRAM_API_ID: ${{ secrets.TINYCHAT_TELEGRAM_API_ID }}
          TINYCHAT_TELEGRAM_API_HASH: ${{ secrets.TINYCHAT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release \
            -p tinyclient --features tinyclient/gui \
            -p chatd -p mediad -p login
      - name: Pack binaries
        run: |
          tar -czf "tinyclient-${{ github.ref_name }}-linux-x86_64.tar.gz" \
            -C target/release tinyclient chatd mediad tinyclient-login
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: tinyclient-${{ github.ref_name }}-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swatinem/rust-cache@v2
      - name: OpenSSL from Git
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Test
        run: cargo test --workspace
        continue-on-error: true
      - name: Build release
        env:
          TINYCHAT_TELEGRAM_API_ID: ${{ secrets.TINYCHAT_TELEGRAM_API_ID }}
          TINYCHAT_TELEGRAM_API_HASH: ${{ secrets.TINYCHAT_TELEGRAM_API_HASH }}
        run: |
          cargo build --release `
            -p tinyclient --features tinyclient/gui `
            -p chatd -p mediad -p login
      - name: Pack binaries
        shell: pwsh
        run: |
          Compress-Archive -Path `
            target/release/tinyclient.exe, `
            target/release/chatd.exe, `
            target/release/mediad.exe, `
            target/release/tinyclient-login.exe `
            -DestinationPath "tinyclient-${{ github.ref_name }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: tinyclient-${{ github.ref_name }}-windows-x86_64.zip

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
