[package]
name = "protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
interprocess = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"

[target.'cfg(windows)'.dependencies]
# Already in the build through interprocess. A pipe's waiting bytes, for read timeouts, and the
# installed WebView2's version (`browser`).
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_System_Registry"] }
