[package]
name = "mediad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
# The voice gateway. Same versions and TLS (Security.framework) as chatd, so nothing is built twice.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Discord's end-to-end encryption (DAVE, MLS on OpenMLS). Pinned: Discord moves the floor, and a
# new version must be read before it is taken.
davey = "=0.1.5"
# A Tiny server call's members and their keys, read from the group davey keeps (`e2ee`). The
# version davey links, so nothing is built twice.
openmls = { version = "0.8.1", features = ["js"] }
# `call.e2ee` payloads, and the MLS ids of users and rooms. Both already in the tree.
base64 = "0.22"
sha2 = "0.10"
# Transport encryption of RTP. Both share `aead`, `aes` and `ghash` with davey.
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cipher = "0.4"
# libopus 1.3.1 transpiled to Rust: no C toolchain, cmake or system library needed.
unsafe-libopus = "=0.2.0"
# CoreAudio capture and playback, and device enumeration.
cpal = "0.18"
rand = "0.8"
# Tiny server calls: WebRTC (ICE, DTLS-SRTP, RTP) as a sans-IO library this process drives from
# its own loop. Pinned to the version tinyserver's SFU runs, and bumped with it. RustCrypto, so
# the same pure-Rust code on every platform: no OpenSSL, no C toolchain, no second TLS stack.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
# Readiness on the call's UDP socket and its ICE-TCP streams. No runtime; already in the tree
# through chatd's tokio.
mio = { version = "1", features = ["os-poll", "net"] }
# Reading voice messages and audio files for `--play`: the containers (Ogg, WebM, MP4, WAV) and
# every codec but Opus, which goes to the libopus above. Pure Rust, so no system library and
# the same on every platform; it lives here so neither the window nor chatd links a codec.
symphonia = { version = "0.5", default-features = false, features = ["ogg", "mkv", "isomp4", "wav", "pcm", "mp3", "aac", "flac", "vorbis"] }
# The microphone's processing (`process`): WebRTC's echo canceller (AEC3), noise suppression and
# automatic gain (AGC2), ported to Rust. Pure Rust like the rest, so it builds on every platform
# with no C toolchain, meson or system library; the C library's own Rust wrapper
# (`webrtc-audio-processing`) needs meson and ninja to build, and none of the other pure-Rust
# echo cancellers is WebRTC's. Pinned: a port moves fast, and a new version must be heard first.
sonora = "=0.2.0"
# Enhanced noise: voice isolation (a DeepFilterNet3-style model) with the weights compiled in,
# so nothing is downloaded. It turns down other voices and cries, which WebRTC's suppressor
# keeps. Apache-2.0. The `cli` feature pulls a wav tool this process does not use.
hush-vani = { version = "0.1.2", default-features = false }
# The watched picture is a JPEG on disk. The jpeg encoder is pure Rust.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Pure-Rust VP8 video decoder (RFC 6386) for receiving Discord VP8 video streams across all five
# platforms with no C toolchain, cmake, or system library. (MIT OR Apache-2.0) AND BSD-3-Clause.
vp8-decoder = "=0.1.2"
# Pure-Rust AV1 video decoder (fork of Prossimo's rav1d / VideoLAN's dav1d) built without the
# optional assembly feature so no nasm or C toolchain is required on Windows, macOS, Linux,
# Android, or iOS. BSD-2-Clause.
rusty_av1d = { version = "=1.3.0", default-features = false, features = ["bitdepth_8"] }

# Desktop: the system's TLS (Security.framework, SChannel, OpenSSL), and Cisco's OpenH264.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Cisco's OpenH264 2.6.0 binary, loaded at runtime (`libloading`). The `source` feature
# compiles the codec from C, which this tree does not. The binary is downloaded from Cisco
# the first time a picture is encoded, and checked against the crate's known hashes. A phone
# may not download code, so phones encode and decode through `platform` instead.
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
# The cameras, through each system's own API: Media Foundation on Windows, AVFoundation on
# macOS, V4L2 on Linux (`input-native`). Pure Rust bindings; nokhwa's own MJPEG decoder needs a
# C build, so `picture/desktop` decodes MJPEG with `image` instead. A machine with no camera
# says so, and the call stays a voice call.
nokhwa = { version = "0.10.10", default-features = false, features = ["input-native"] }
# Its option names: the wrapper sets a bitrate only when it opens. The version openh264 links.
openh264-sys2 = { version = "=0.9.9", default-features = false, features = ["libloading"] }
# The Cisco binary is bz2. Pure Rust, so the release image needs no libbz2.
bzip2-rs = "0.1.2"
# The download of that binary. Its `native-tls` feature is only the adapter for the system's
# TLS, which is already linked: ureq never picks that as a default, so the agent a download
# builds names the connector (`picture/desktop.rs`, `fetch_url`).
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }

# The voice gateway's TLS, the system's, as chatd's everywhere but Android (`chatd::tls`).
[target.'cfg(not(target_os = "android"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# The same TLS tungstenite uses, named here only to hand it one more certificate to trust when a
# test's fake voice server speaks `wss` (see `gateway::connector`).
native-tls = "0.2"

# Android: rustls with ring and the bundled Mozilla roots, as chatd there. Nothing to cross-build.
[target.'cfg(target_os = "android")'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
# MMCSS scheduling for the device callbacks and the call's tick, and the 1 ms system timer a
# call's 20 ms tick needs (`rt`), and the screens and windows a share can send (`picture/screens`).
# Already in the tree through cpal and mio.
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# A screen share through DXGI Desktop Duplication (`picture/duplicate`): Direct3D 11 and DXGI are
# COM, which the `windows` crate wraps. The version notifier already builds. Media Foundation's
# hardware H.264 encoder (`mf_encoder`) is COM too, with its variants (`Variant`) beside it.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
# `#[windows::core::implement]` emits `windows_core::` paths, so the crate has to be named here.
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
# The priority of video's threads. Already in the tree through mio and cpal.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# AVCaptureDevice's microphone authorization, which CoreAudio does not report.
objc2 = "0.6"
# A screen grab for a share. CoreGraphics is on the system; this does not compile C.
core-graphics = "0.24"
# macOS display and window capture uses ScreenCaptureKit and Core Video.
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSDictionary", "NSObject", "NSValue"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "bitflags", "CVBase", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "bitflags", "VTCompressionProperties", "VTCompressionSession", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

[target.'cfg(target_os = "linux")'.dependencies]
# A screen grab over the X11 protocol. Pure Rust, so the release image needs no X11 headers.
# An X11 session (XFCE, MATE, Cinnamon, i3, and the rest) uses this. A Wayland session uses the
# desktop portal instead (`picture/portal.rs`).
x11rb = { version = "0.13", features = ["composite", "randr", "shm", "xfixes"] }
memmap2 = "0.9"
# The session bus for xdg-desktop-portal. Pure Rust, so this does not link a second libdbus
# beside the one chatd already vendors.
zbus = "5"
# PipeWire is loaded by name when a portal capture starts. The binary still launches where the
# library is absent, and the package does not depend on it.
libloading = "0.8"

[dev-dependencies]
# The fake voice server acts as Discord's MLS external sender. Same version davey links.
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
# Pure-Rust VP8 encoder for generating real VP8 keyframes and interframes in tests.
vp8-encoder = "=0.1.2"
