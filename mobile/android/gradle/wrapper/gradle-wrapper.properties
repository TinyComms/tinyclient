# AGP 9.5 requires Gradle 9.6. The wrapper script and jar are not committed (they are binary,
# and this checkout has no Gradle to generate them). Bootstrap once with:
#   gradle wrapper --gradle-version 9.6
# or let CI's `gradle/actions/setup-gradle` supply the distribution. The build scripts under
# scripts/mobile/ use `gradlew.bat` when present and fall back to `gradle` on PATH.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
